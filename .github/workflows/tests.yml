name: tests

# Прогон smoke-тестов + ruff на каждом push и pull_request.
# Тесты запускаются на ubuntu (python 3.8 / 3.9 / 3.10 / 3.11 / 3.12) и windows.
# Сеть в test_handler делает один реальный fetch к https://example.com/

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke (${{ matrix.os }} · py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Run smoke tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash scripts/tests/run_tests.sh

      - name: Run smoke tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/tests/run_tests.ps1

      # При failure приложить _fail_*.log (run_tests.sh/ps1 пишет stdout+stderr
      # каждого упавшего теста в такой файл) — можно скачать в GitHub UI
      # run'а и увидеть, что именно упало.
      - name: Upload smoke test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-${{ runner.os }}-py${{ matrix.python }}
          path: scripts/tests/_fail_*.log
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        # Зафиксирована версия — локально (Windows + Ubuntu) ruff 0.15.16
        # проходит ruff check . / ruff format --check . 'без ошибок'.
        # Раньше было >=0.5, что приводило к сюрпризам при upgrade ruff.
        run: pip install ruff==0.15.16

      - name: ruff check
        run: |
          set +e
          ruff check . --output-format=concise 2>&1 | tee ruff_check.log
          rc=${PIPESTATUS[0]}
          echo "ruff check exit=$rc"
          exit $rc

      - name: ruff format --check
        run: |
          set +e
          ruff format --check . 2>&1 | tee ruff_format.log
          rc=${PIPESTATUS[0]}
          echo "ruff format --check exit=$rc"
          exit $rc

      # always() — потому что GitHub Actions по дефолту пропускает steps после
      # failure, и без always() upload не запустится.
      - name: Upload ruff logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-logs
          path: ruff_check.log ruff_format.log
          if-no-files-found: ignore
          retention-days: 7
