name: tests

# Прогон smoke-тестов + ruff на каждом push и pull_request.
# Тесты запускаются на ubuntu (python 3.8 / 3.9 / 3.10 / 3.11 / 3.12) и windows.
# Сеть в test_handler делает один реальный fetch к https://example.com/

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke (${{ matrix.os }} · py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Run smoke tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash scripts/tests/run_tests.sh

      - name: Run smoke tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/tests/run_tests.ps1

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff>=0.5

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .
