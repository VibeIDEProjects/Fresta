[project]
name = "fresta"
version = "0.2.0"
description = "Инструмент доступа к открытому интернету под российскими операторскими белыми списками (мобильные сети)."
readme = "README.md"
# SPDX-идентификатор по PEP 639 (рекомендация 2024+). pip >= 24 покажет warning,
# если оставить `text = "..."` (старый формат). Файл LICENSE включится в wheel
# через `license-files` ниже.
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
keywords = ["vpn", "whitelist", "vless", "reality", "russia", "censorship-circumvention"]
authors = [
    { name = "fresta maintainers" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Security",
]
# Зависимостей нет — всё stdlib. Но добавили [project.optional-dependencies]
# для dev-инструментов (CI), чтобы `pip install -e .[dev]` поднимал всё одной командой.

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "types-requests>=2.32",
    "build>=1.0",          # python -m build
    "twine>=5.0",          # twine upload dist/*
]

[project.urls]
"Repository" = "https://github.com/VibeIDEProjects/Fresta"
"Issues"     = "https://github.com/VibeIDEProjects/Fresta/issues"

# ─── Entry points (CLI-скрипты, попадают в PATH при `pip install fresta`) ───
# После установки пользователь получает в $PATH:
#   fresta-recon, fresta-harvest-sni, fresta-harvest-twl, fresta-gen-vless,
#   fresta-validate, fresta-sanity, fresta-diff
# .sh-скрипты (quickstart.sh, deploy_vps.sh, rotate_keys.sh) — не entry points:
# они требуют bash + ssh + scp, ставить их в PATH на Windows бессмысленно.

[project.scripts]
fresta-recon         = "scripts.recon.fresta_recon:main"
fresta-harvest-sni   = "scripts.harvest.harvest_subscription:main"
fresta-harvest-twl   = "scripts.harvest.harvest_twl:main"
fresta-gen-vless     = "scripts.deploy.fresta_gen_vless:main"
fresta-validate      = "scripts.deploy.validate_config:main"
fresta-sanity        = "scripts.check.sanity:main"
fresta-diff          = "scripts.deploy.diff_configs:main"

# Минимальный setuptools, чтобы `pip install -e .` и `python -m build` работали.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Что упаковываем:
#   - пакет fresta/ (метаинформация, __init__.py с __version__)
#   - скрипты scripts/ как sub-packages (чтобы entry points работали)
#   - схемы schemas/*.json как package_data (чтобы validate_config.py находил их после install)
packages = ["fresta", "scripts", "scripts.check", "scripts.recon", "scripts.harvest",
            "scripts.deploy", "scripts.relay", "scripts.relay.yc_function",
            "scripts.tests"]

[tool.setuptools.package-data]
"fresta" = ["py.typed"]   # маркер PEP 561 (сигнализируем type-checker'ам, что типов нет, но пакет поддерживает)
"scripts" = ["../schemas/*.json"]  # schemas/ лежит на уровень выше scripts/

# --- ruff (быстрый линтер, замена flake8+isort+pyupgrade) ----------------
[tool.ruff]
line-length = 100
target-version = "py38"
extend-exclude = [
    "scripts/deploy/configs/**",     # сгенерированные (Xray/sing-box)
    "scripts/harvest/twl-data/**",   # скачанный клон + большие файлы
    ".vibe/**",
]

[tool.ruff.lint]
# Базовый набор + самые полезные:
select = [
    "E", "W",     # pycodestyle
    "F",          # pyflakes
    "I",          # isort
    "B",          # flake8-bugbear
    "UP",         # pyupgrade
    "SIM",        # flake8-simplify
    "RUF",        # ruff-specific
    "N",          # pep8-naming
]
# Не критично, но полезно: длинные строки, TODO, FIXME.
ignore = [
    "E501",   # line too long (мы трактуем комментарии-баннеры отдельно)
    "B008",   # function call in default argument (часто ОК для argparse)
    "N806",   # variable in caps (XRAY_SING_BOX_NAMES etc.)
]
# Разрешаем русские docstring / строки.
allowed-confusables = ["«", "»", "—", "–", "…"]

[tool.ruff.lint.per-file-ignores]
"scripts/tests/*" = ["E402"]   # импорты после sys.path manipulation в smoke-тестах

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- mypy (опционально — для тех, кто хочет strict) ---------------------
[tool.mypy]
python_version = "3.8"
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
ignore_missing_imports = true   # нет внешних зависимостей
# Не включаем strict глобально (легаси модули не типизированы),
# но pytest strict для нового кода.
[[tool.mypy.overrides]]
module = "scripts.tests.*"
ignore_errors = true

# --- pytest --------------------------------------------------------------
# Smoke-тесты лежат в scripts/tests/ и сейчас запускаются через
# run_tests.sh/ps1. Дополнительно можно запускать через `pytest` —
# для этого они должны быть собраны в test_*.py (уже так) и
# импортируемы (для этого добавим conftest.py, см. scripts/tests/conftest.py).

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
